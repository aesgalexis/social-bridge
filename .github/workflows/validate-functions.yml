name: Validate Social Bridge

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "scripts/**"
      - "outbox/linkedin/**"
      - "media/linkedin/**"
      - ".github/workflows/publish-linkedin.yml"
      - ".github/workflows/schedule-linkedin.yml"
      - ".github/workflows/validate-functions.yml"
  pull_request:
    paths:
      - "functions/**"
      - "scripts/**"
      - "outbox/linkedin/**"
      - "media/linkedin/**"
      - ".github/workflows/publish-linkedin.yml"
      - ".github/workflows/schedule-linkedin.yml"
      - ".github/workflows/validate-functions.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate Functions syntax
        working-directory: functions
        run: npm run check

      - name: Validate delivery runner syntax
        run: node --check scripts/publish-linkedin.mjs

      - name: Validate outbox validator syntax
        run: node --check scripts/validate-linkedin-outbox.mjs

      - name: Validate LinkedIn outbox and referenced media
        run: node scripts/validate-linkedin-outbox.mjs
